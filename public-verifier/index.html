<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control d'Accés — Planta Industrial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ok: #1a7a4a;
            --ok-bg: #f0faf5;
            --ok-b: #a8d5bc;
            --err: #c0392b;
            --err-bg: #fdf2f2;
            --err-b: #e8a89e;
            --wait-bg: #f4f5f7;
            --text: #1a2332;
            --text-dim: #6b7a8d;
            --border: #d0d5dd;
            --accent: #1a4f8a;
            --sans: 'Barlow', sans-serif;
            --cond: 'Barlow Condensed', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body { font-family: var(--sans); background: var(--wait-bg); color: var(--text); display: flex; flex-direction: column; transition: background 600ms ease; }

        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-logo { width: 36px; height: 36px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--cond); font-weight: 900; font-size: 16px; letter-spacing: -.02em; }
        .header-title { font-weight: 700; font-size: 16px; color: var(--text); }
        .header-sub { font-size: 12px; color: var(--text-dim); }
        .header-right { font-size: 12px; color: var(--text-dim); font-family: 'Courier New', monospace; }
        #clock { color: var(--text); font-weight: 600; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 32px; }

        .screen { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 560px; }
        .screen.active { display: flex; animation: fadeIn 400ms ease; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

        .qr-label { font-family: var(--cond); font-weight: 700; font-size: 22px; letter-spacing: .02em; color: var(--text); text-align: center; }
        .qr-sub { font-size: 14px; color: var(--text-dim); text-align: center; }
        .qr-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        #qr-img { width: 220px; height: 220px; display: block; }
        .qr-hint { font-size: 13px; color: var(--text-dim); text-align: center; border-top: 1px solid var(--border); padding-top: 14px; width: 100%; }
        .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 6px; animation: pulse 2s ease-in-out infinite; }

        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

        .verify-spinner { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--border); border-top-color: var(--accent); animation: spin 900ms linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .verify-label { font-family: var(--cond); font-weight: 700; font-size: 24px; color: var(--text); }
        .verify-sub { font-size: 14px; color: var(--text-dim); }

        .result-icon { font-size: 72px; line-height: 1; animation: iconPop 400ms cubic-bezier(.34,1.56,.64,1); }
        @keyframes iconPop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
        .result-verdict { font-family: var(--cond); font-weight: 900; font-size: clamp(36px, 6vw, 56px); letter-spacing: .02em; text-align: center; }
        .result-verdict.ok { color: var(--ok); }
        .result-verdict.err { color: var(--err); }

        .creds-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .cred-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
        .cred-card.present { border-left: 3px solid var(--ok); }
        .cred-card.missing { border-left: 3px solid var(--err); background: var(--err-bg); }
        .cred-card.no-requerit { opacity: 0.45; }
        .cred-header { display: flex; align-items: center; gap: 10px; }
        .cred-status { font-size: 18px; flex-shrink: 0; }
        .cred-name { font-weight: 700; font-size: 14px; }
        .cred-name.missing { color: var(--err); }
        .cred-attrs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .attr-chip { background: #f4f5f7; border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-size: 12px; font-family: 'Courier New', monospace; color: var(--text); }
        .attr-chip span { color: var(--text-dim); margin-right: 4px; }
        .missing-reason { font-size: 13px; color: var(--err); margin-top: 2px; }

        .countdown-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .countdown-fill { height: 100%; border-radius: 2px; animation: countdown linear forwards; }
        .countdown-fill.ok { background: var(--ok); }
        .countdown-fill.err { background: var(--err); }
        @keyframes countdown { from{width:100%} to{width:0%} }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <div class="header-logo">SSI</div>
            <div>
                <div class="header-title">Control d'Accés — Planta Industrial</div>
                <div class="header-sub">Sistema d'Identitat Auto-Sobirana · AnonCreds ZKP</div>
            </div>
        </div>
        <div class="header-right"><span id="clock"></span></div>
    </header>

    <main>
        <!-- PANTALLA 1: QR -->
        <div class="screen active" id="screen-qr">
            <div class="qr-label">Escaneja per verificar accés</div>
            <div class="qr-sub">L'operari ha de presentar les seves credencials amb BC Wallet</div>
            <div class="qr-box">
                <img id="qr-img" src="" alt="QR de verificació" />
                <div class="qr-hint">
                    <span class="pulse-dot"></span>
                    Sistema actiu · Esperant operari
                </div>
            </div>
        </div>

        <!-- PANTALLA 2: Verificant -->
        <div class="screen" id="screen-verify">
            <div class="verify-spinner"></div>
            <div class="verify-label">Verificant credencials…</div>
            <div class="verify-sub">Validant prova ZKP contra BCovrin Testnet</div>
        </div>

        <!-- PANTALLA 3: Resultat -->
        <div class="screen" id="screen-result">
            <div class="result-icon" id="result-icon"></div>
            <div class="result-verdict" id="result-verdict"></div>
            <div class="creds-grid" id="creds-grid"></div>
            <div class="countdown-bar">
                <div class="countdown-fill" id="countdown-fill"></div>
            </div>
        </div>
    </main>

    <script>
        // rellotge
        function actualitzarRellotge() {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('ca-ES', { hour12: false })
        }
        actualitzarRellotge()
        setInterval(actualitzarRellotge, 1000)

        let pantallaActual = 'qr'
        let ultimTs = null
        let timerResultat = null
        const DURADA_RESULTAT = 8000

        // mapa de metadades de les credencials
        // grup_* → noms dels grups a la ProofRequest del verificador
        // etiquetes → text que es mostra al panel
        const META_CREDS = {
            ot: {
                etiqueta: 'Ordre de Treball',
                // atributs que el verificador revela de la OT
                grups: ['grup_equip', 'grup_tasca'],
                claus: ['equip', 'tasca'],
                semprePresent: true, // la OT sempre es demana, no és opcional
            },
            atex: {
                etiqueta: 'Certificat ATEX',
                grups: ['grup_zona', 'grup_nivell_atex'],
                claus: ['zona', 'nivell_atex'],
                semprePresent: false, // només si la OT ho requereix
            },
            soldador: {
                etiqueta: 'Homologació Soldador',
                grups: ['grup_proces', 'grup_norma'],
                claus: ['procés', 'norma'],
                semprePresent: false,
            },
        }

        function mostrarPantalla(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
            document.getElementById('screen-' + id).classList.add('active')
            pantallaActual = id
        }

        async function carregarQR() {
            try {
                const r = await fetch('/api/qr')
                const { url } = await r.json()
                if (url) {
                    const codificat = encodeURIComponent(url)
                    document.getElementById('qr-img').src =
                        `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${codificat}`
                }
            } catch {}
        }

        function renderitzarResultat(event) {
            const icon    = document.getElementById('result-icon')
            const verdict = document.getElementById('result-verdict')
            const grid    = document.getElementById('creds-grid')
            const fill    = document.getElementById('countdown-fill')

            icon.textContent    = event.valid ? '✅' : '❌'
            verdict.textContent = event.valid ? 'ACCÉS CONCEDIT' : 'ACCÉS DENEGAT'
            verdict.className   = 'result-verdict ' + (event.valid ? 'ok' : 'err')

            grid.innerHTML = ''

            // saber quines credencials s'han demanat (llegim dels attrs del resultat)
            const attrsRebuts = Object.keys(event.attrs)
            const teniAtex    = attrsRebuts.some(k => k.startsWith('grup_zona') || k.startsWith('grup_nivell'))
            const teniSoldador = attrsRebuts.some(k => k.startsWith('grup_proces') || k.startsWith('grup_norma'))

            for (const [clau, meta] of Object.entries(META_CREDS)) {
                // si no és la OT i no s'ha demanat aquesta credencial, mostram-la apagada
                const esRequerida = meta.semprePresent ||
                    (clau === 'atex' && teniAtex) ||
                    (clau === 'soldador' && teniSoldador)

                const falta = event.missing.some(m => m.includes(meta.etiqueta))
                const card = document.createElement('div')

                if (!esRequerida) {
                    card.className = 'cred-card no-requerit'
                    card.innerHTML = `
                        <div class="cred-header">
                            <span class="cred-status">—</span>
                            <span class="cred-name">${meta.etiqueta}</span>
                            <span style="font-size:11px;color:var(--text-dim);margin-left:auto">No requerida per aquesta OT</span>
                        </div>`
                } else if (falta) {
                    card.className = 'cred-card missing'
                    card.innerHTML = `
                        <div class="cred-header">
                            <span class="cred-status">✗</span>
                            <span class="cred-name missing">${meta.etiqueta}</span>
                        </div>
                        <div class="missing-reason">${event.missing.find(m => m.includes(meta.etiqueta)) ?? 'Credencial no presentada o no vàlida'}</div>`
                } else {
                    card.className = 'cred-card present'
                    const xipsHtml = meta.grups.map((grupKey, i) => {
                        const val = event.attrs[grupKey]
                        return val ? `<div class="attr-chip"><span>${meta.claus[i]}:</span>${val}</div>` : ''
                    }).join('')
                    card.innerHTML = `
                        <div class="cred-header">
                            <span class="cred-status">✓</span>
                            <span class="cred-name">${meta.etiqueta}</span>
                        </div>
                        <div class="cred-attrs">${xipsHtml}</div>`
                }

                grid.appendChild(card)
            }

            // barra de compte enrere
            fill.className = 'countdown-fill ' + (event.valid ? 'ok' : 'err')
            fill.style.animationDuration = DURADA_RESULTAT + 'ms'
            fill.style.animation = 'none'
            fill.offsetHeight // reflow per reiniciar l'animació
            fill.style.animation = ''
            fill.style.animationDuration = DURADA_RESULTAT + 'ms'

            document.body.style.background = event.valid ? '#f0faf5' : '#fdf2f2'

            clearTimeout(timerResultat)
            timerResultat = setTimeout(() => {
                document.body.style.background = ''
                mostrarPantalla('qr')
            }, DURADA_RESULTAT)
        }

        // pol·ling: cada 1.5s demanam si hi ha un resultat nou
        async function poll() {
            try {
                const r = await fetch('/api/estat')
                const event = await r.json()

                if (!event) return

                if (event.ts !== ultimTs) {
                    ultimTs = event.ts
                    mostrarPantalla('result')
                    renderitzarResultat(event)
                }
            } catch {}
        }

        // init
        carregarQR()
        setInterval(poll, 1500)
        setInterval(() => {
            if (pantallaActual === 'qr') carregarQR()
        }, 3000)
    </script>
</body>

</html>
